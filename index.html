<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgotten Flavors</title>
    <script>
      // Single Page Apps for GitHub Pages — decode the redirect from 404.html
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&');
            });
          // Preserve the subdirectory base path (e.g. /forgotten-flavors on GitHub Pages).
          // index.html is served from that base, so l.pathname gives us the prefix we need
          // to prepend before the decoded route — otherwise replaceState strips it and
          // React Router's basename no longer matches.
          var basePath = l.pathname.replace(/\/$/, '');
          window.history.replaceState(
            null,
            null,
            basePath + decoded[0] + (decoded[1] ? '&' + decoded[1] : '') + l.hash
          );
        }
      })(window.location);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
